# Test-only config so @SpringBootTest can load the context offline, without a
# running Postgres/pgvector, Eureka registry, or a real embedding backend.
# Excludes the datasource + pgvector autoconfig; the embedding bean builds a
# client lazily (no network call at construction).
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

rag.embedding.api-key=test-key

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
