spring.application.name=rag_service

# ENV loading (same convention as the other services)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8085}

# Service discovery
eureka.client.service-url.defaultZone=${SERVER_URL}

# ---------------------------------------------------------------------------
# Postgres — shared instance, rag_db database (must have the `vector`
# extension; pgvector/pgvector image + init script provide it).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# pgvector vector store.
# initialize-schema=true auto-creates the table, the `vector` extension, and
# an index on first boot.
#
# IMPORTANT — dimensions is coupled to the embedding model and is baked into
# the vector column when the table is created:
#   text-embedding-3-small (OpenAI, default) -> 1536
#   nomic-embed-text        (Ollama)         -> 768
# Changing the embedding model later means changing this value AND
# dropping/recreating the table (re-embedding every document).
# ---------------------------------------------------------------------------
spring.ai.vectorstore.pgvector.initialize-schema=${VECTOR_INIT_SCHEMA:true}
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=rag_document_chunks

# ---------------------------------------------------------------------------
# Embedding backend (OpenAI-compatible).
# Default: OpenAI text-embedding-3-small — offloads compute, trivial cost.
# To use a local Ollama instead (no API cost, higher device load), set:
#   EMBEDDING_BASE_URL=http://localhost:11434/v1
#   EMBEDDING_API_KEY=ollama
#   EMBEDDING_MODEL=nomic-embed-text
# and change spring.ai.vectorstore.pgvector.dimensions=768 (see note above).
# ---------------------------------------------------------------------------
rag.embedding.base-url=${EMBEDDING_BASE_URL:https://api.openai.com/v1}
rag.embedding.api-key=${EMBEDDING_API_KEY:${OPEN_API_KEY:changeme}}
rag.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}

# The OpenAI starter auto-configures chat/audio/image/moderation/embedding
# models, all of which fail fast without a global spring.ai.openai.api-key.
# This service builds its own embedding client (see EmbeddingConfig) via the
# rag.embedding.* properties, so disable the starter's model autoconfigs.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# Multipart upload limits for document ingestion.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Actuator: expose health for the gateway/orchestration probes.
management.endpoints.web.exposure.include=health,info
