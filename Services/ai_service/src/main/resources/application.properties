spring.application.name=ai_service

# ENV loading
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8082}

spring.ai.openai.api-key=${OPEN_API_KEY}
spring.ai.openai.base-url=${OPEN_API_BASE_URL}
spring.ai.openai.chat.model=${CHAT_MODEL}
eureka.client.service-url.defaultZone = ${SERVER_URL}

# ---------------------------------------------------------------------------
# AI Providers (provider-agnostic abstraction)
# Each registration is one OpenAI-compatible endpoint. The engine selects a
# provider per request (request.provider), else uses ai.providers.default,
# and falls back to other fallback-eligible providers on failure.
# ---------------------------------------------------------------------------
ai.providers.default=${AI_DEFAULT_PROVIDER:ollama}

# OpenAI (or any hosted OpenAI-compatible gateway)
ai.providers.registrations[0].name=openai
ai.providers.registrations[0].base-url=${OPEN_API_BASE_URL:https://api.openai.com/v1}
ai.providers.registrations[0].api-key=${OPEN_API_KEY:changeme}
ai.providers.registrations[0].model=${CHAT_MODEL:gpt-4o-mini}
ai.providers.registrations[0].enabled=${OPENAI_ENABLED:true}

# Ollama local runtime (OpenAI-compatible endpoint, no real key needed)
ai.providers.registrations[1].name=ollama
ai.providers.registrations[1].base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
ai.providers.registrations[1].api-key=ollama
ai.providers.registrations[1].model=${OLLAMA_MODEL:qwen2.5-coder:7b}
ai.providers.registrations[1].enabled=${OLLAMA_ENABLED:true}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI Chat Memory Repository Configuration
# Override with CHAT_MEMORY_INIT_SCHEMA=never in production (schema managed by migrations).
spring.ai.chat.memory.repository.jdbc.initialize-schema=${CHAT_MEMORY_INIT_SCHEMA:always}