spring.application.name=ai_service

# ENV loading
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8082}

spring.ai.openai.api-key=${OPEN_API_KEY}
spring.ai.openai.base-url=${OPEN_API_BASE_URL}
spring.ai.openai.chat.model=${CHAT_MODEL}
eureka.client.service-url.defaultZone = ${SERVER_URL}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI Chat Memory Repository Configuration
# Override with CHAT_MEMORY_INIT_SCHEMA=never in production (schema managed by migrations).
spring.ai.chat.memory.repository.jdbc.initialize-schema=${CHAT_MEMORY_INIT_SCHEMA:always}