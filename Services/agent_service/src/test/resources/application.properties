# Test-only config so @SpringBootTest can load the context offline,
# without a running Eureka registry or a real signing secret.
jwt.secret=test-secret-that-is-at-least-32-bytes-long-000000

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
