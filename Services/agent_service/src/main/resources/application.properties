spring.application.name=agent_service

# ENV loading (same convention as the other services)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8084}

# Service discovery
eureka.client.service-url.defaultZone=${SERVER_URL}

# JWT — MUST be the same secret auth_service signs tokens with, so this
# service can validate them statelessly (no shared user database).
jwt.secret=${JWT_SECRET}

# Downstream service ids as registered in Eureka (used by the load-balanced
# RestClient). Override if the registered application names change.
agent.downstream.ai-service=ai_service

# Actuator: expose health for the gateway/orchestration probes.
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# Resilience4j — circuit breaker + time limiter around downstream AI calls.
# Opens the breaker after a burst of failures so the agent degrades to a
# clean 503 instead of hanging when the AI service is down.
# ---------------------------------------------------------------------------
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=120s
