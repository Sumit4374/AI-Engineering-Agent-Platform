spring.application.name=ai_engineering

# Read environment variables from .env file
spring.config.import=optional:file:.env[.properties]

# Port configuration
server.port=${SERVER_PORT:8080}

#cors configuration
app.cors.allowed-origin = ${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:8080}


# ============================================================
# Database
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — schema is managed by Flyway; Hibernate only validates at startup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ============================================================
# Spring AI — OpenAI-compatible provider (NVIDIA NIM / Gemini)
# ============================================================
ai.provider.active=${AI_PROVIDER:OPENAI}
spring.ai.openai.api-key=${OPEN_API_KEY:${OPENAI_API_KEY:}}
spring.ai.openai.base-url=${OPEN_API_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.model=${CHAT_MODEL:qwen/qwen3.8-flash}
spring.ai.openai.chat.options.model=${CHAT_MODEL:qwen/qwen3.8-flash}
ai.openai.api-key=${OPEN_API_KEY:${OPENAI_API_KEY:}}
ai.openai.model=${CHAT_MODEL:qwen/qwen3.8-flash}

# Chat memory — Spring AI JDBC repository
spring.ai.chat.memory.repository.jdbc.initialize-schema=${CHAT_MEMORY_INIT_SCHEMA:always}

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# ============================================================
# Kafka — Event-Driven Architecture
# ============================================================
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ai-engineering-platform
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=sumit.ai.ai_engineering.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer